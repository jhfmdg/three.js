<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - animation - skinning</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			a {
				color: #f00;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Skeletal Animation Blending
			(model from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">mixamo.com</a>)<br/>
			Note: crossfades are possible with blend weights being set to (1,0,0), (0,1,0) or (0,0,1)
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

	import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

			let scene, renderer, camera, stats;
			let model, skeleton, mixer;
			let center;

			init();

			function init() {

				const container = document.getElementById( 'container' );

				scene = new THREE.Scene();

				scene.background = new THREE.Color( 0xa0a0a0 );
				scene.fog = new THREE.Fog( 0xa0a0a0, 10, 80 );

				addLight();
				addGround();

				if (modelName == "" || modelName == undefined || modelName == "null") modelName = "default.glb";

				const loader = new GLTFLoader();
				loader.load( 'http://127.0.0.1:19003/WZB/gltf/'+modelName, function ( gltf ) {
				// loader.load( 'http://192.168.3.217:19003/gltf/knife.glb', function ( gltf ) {

					model = gltf.scene;
					scene.add( model );

					model.traverse( function ( object ) {

						if ( object.isMesh ) object.castShadow = true;
					} );
					let box3 = new THREE.Box3();
					let bbox = new THREE.Box3();
					box3.expandByObject(model);
					let size = new THREE.Vector3();
					box3.getSize(size); // 计算包围盒尺寸
					center = new THREE.Vector3();
					box3.getCenter(center); // 计算一个层级模型对应包围盒的几何体中心坐标
					// model.scale.multiplyScalar(1.0 / maxAxis);
					//Reposition to 0,halfY,0
					model.position.copy(center).multiplyScalar(-1);
					model.position.y += (size.y * 0.5);
					animate();

				} );

				render()

				// camera
				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 100 );
				camera.position.set( 10, 10, 10);

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 3;
				controls.maxDistance = 50;
				// controls.target.set( 0, 0.35, 0 );
				controls.target.set( 0, 1, 0);
				controls.update();

				// stats = new Stats();
				// container.appendChild( stats.dom );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				// Render loop

				requestAnimationFrame( animate );

				// stats.update();

				renderer.render( scene, camera );

			}

			function addGround() {
				// ground

				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x999999, depthWrite: false } ) );
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				const grid = new THREE.GridHelper( 200, 20, 0x000000, 0x000000 );
				grid.material.opacity = 0.2;
				grid.material.transparent = true;
				scene.add( grid );
			}

			function addLight() {
				const hemiLight = new THREE.HemisphereLight( 0xcccccc, 0x444444 );
				hemiLight.position.set( 0, 20, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xcccccc );
				dirLight.position.set( 3, 10, 10 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 2;
				dirLight.shadow.camera.bottom = - 2;
				dirLight.shadow.camera.left = - 2;
				dirLight.shadow.camera.right = 2;
				dirLight.shadow.camera.near = 0.1;
				dirLight.shadow.camera.far = 100;
				scene.add( dirLight );
			}

			function render() {
				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				const environment = new RoomEnvironment();
				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				scene.environment = pmremGenerator.fromScene( environment ).texture;
				environment.dispose();

			}

			/**
			 * 判断文本是否包含特殊字符
			 * @param text
			 */
			function isContainsSpecialSymbols(text) {
				var reg = new RegExp("[~#^$@%&!?%*]", 'g');
				if (text.match(reg)) {
					return true;
				}
				return false;
			}

		</script>

	</body>
</html>
